# way-pad 配置示例
# 复制到 ~/.config/way-pad/config.toml 后按需修改；
# 每个字段都有默认值，省略即用默认。

# 隐藏窗口的后端：
#   auto             — 是 driftwm 会话就用 driftwm IPC（移出画布隐藏），
#                      否则用 foreign-toplevel 协议（最小化）
#   driftwm          — 强制 driftwm IPC
#   foreign-toplevel — 强制标准协议（wlroots/smithay 系合成器）
backend = "auto"

# 隐藏方式（仅 driftwm 后端支持 opacity）：
#   opacity — 窗口原地全透明（推荐）：不搬移窗口，zoom-to-fit / home 等
#             全局视野操作零影响；注意透明窗口通常仍会拦截鼠标点击
#   move    — 窗口移到画布极远的藏匿点：zoom-to-fit / home 等"适配全部
#             窗口"的操作会被藏匿点窗口拉扯，导致视野飞向画布远端
hide_mode = "opacity"

# 显示器分辨率（屏幕像素）：driftwm 后端用于判断窗口是否在当前视野内、
# 换算百分比尺寸、以及 fullscreen 的目标尺寸
viewport = [1920, 1080]

# launch 启动后等待匹配窗口出现的默认毫秒数（可被 pad 级覆盖）
launch_wait_ms = 1500

# ---------------------------------------------------------------------------
# 每个 [pads.<名字>] 定义一个 pad：一组可整体显示/隐藏的窗口。
#
#   app_id          匹配窗口 app_id 的正则表达式（必填）
#   title           匹配窗口标题的正则表达式（可选，省略或留空 = 不限定）
#   launch          没有匹配窗口时启动的命令，经 sh -c 执行（可选）
#   focus_on_show   显示时是否聚焦窗口（默认 true）
#   launch_wait_ms  该 pad 的启动等待超时（覆盖顶层值）
#
# 窗口几何（仅 driftwm 后端支持）：
#   width           显示时的窗口宽度：像素（1600）或视口百分比（"90%"）
#   height          显示时的窗口高度：同上
#   edge            停靠边：top / bottom / left / right / center（默认 top）
#   margin          距视野边缘的边距，屏幕像素（默认 0）
#   fullscreen      显示时占满当前视野；为 true 时忽略上面四项
#
# 显示时窗口总是出现在当前视野的对应位置；隐藏期间即使移动了视野，
# 窗口也会被带到眼前。width/height/edge/margin 全部省略时保持窗口原样。
#
# 提示：先运行 `way-pad list` 或 `way-pad doctor` 查看各窗口实际的
# app_id / title 与匹配情况。一个 pad 匹配多个窗口时，它们会被当作
# 一组一起切换。
# ---------------------------------------------------------------------------

# 下拉终端：贴屏幕顶部、距顶边 24px、高 50% 视口，宽度保持不变
[pads.term]
app_id = '^foot$'
launch = 'foot'
edge = "top"
margin = 24
height = "50%"

# 编辑器：视口 80% x 90%，居中；emacs 启动慢，单独放宽等待时间
[pads.editor]
app_id = '^way-pad-emacs$'
launch = 'emacs --name way-pad-emacs'
width = "80%"
height = "90%"
edge = "center"
launch_wait_ms = 9000

# 全屏 pad：显示时占满当前视野
[pads.calc]
app_id = '^gnome-calculator$'
launch = 'gnome-calculator'
fullscreen = true

# 不需要几何控制的窗口：只写匹配规则即可
[pads.music]
app_id = '^mpv$'
title = '^mpv —'
launch = 'mpv --player-operation-mode=pseudo-gui'
